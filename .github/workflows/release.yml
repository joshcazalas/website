name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    with:
      package-release: true
    secrets:
      ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}

  publish:
    name: Attest and publish immutable release
    needs: build
    # Publishing requires a separate, explicit opt-in after public-repository sign-off.
    if: github.event.repository.private == false && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: website-release-${{ github.sha }}
          path: release
      - name: Check release identity, completeness, and hashes
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('release')
          expected = {'website.tar.gz', 'manifest.json', 'site-inventory.json', 'asset-inventory.json', 'sbom-runtime.cdx.json', 'sbom-build.cdx.json', 'SHA256SUMS'}
          assert {p.name for p in root.iterdir()} == expected, 'Unexpected release files'
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['repository'] == 'joshcazalas/website'
          assert manifest['source_ref'] == 'refs/heads/main'
          assert manifest['commit'] == os.environ['EXPECTED_COMMIT']
          assert manifest['tag'] == os.environ['EXPECTED_TAG']
          assert set(manifest['files']) == expected - {'manifest.json', 'SHA256SUMS'}
          for name, info in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == info['size'] and hashlib.sha256(data).hexdigest() == info['sha256']
          lines = (root / 'SHA256SUMS').read_text().splitlines()
          assert len(lines) == len(expected) - 1
          checksums = dict(line.split('  ', 1)[::-1] for line in lines)
          assert set(checksums) == expected - {'SHA256SUMS'}
          for name, checksum in checksums.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == checksum
          PY
      - name: Attest every release file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Bind the runtime SBOM to the deployable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/website.tar.gz
          sbom-path: release/sbom-runtime.cdx.json
      - name: Upload a complete draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # No clobber or delete: reruns cannot silently replace a release.
          gh release create "$RELEASE_TAG" release/* --repo joshcazalas/website \
            --target "$COMMIT_SHA" --draft --title "$RELEASE_TAG" \
            --notes "Verified website build from commit $COMMIT_SHA."
          gh release edit "$RELEASE_TAG" --repo joshcazalas/website --draft=false
          gh api "repos/joshcazalas/website/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -qx true
          gh release verify "$RELEASE_TAG" --repo joshcazalas/website
