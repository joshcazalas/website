name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    secrets:
      ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      build-artifact: ${{ needs.build.outputs.artifact-name }}

  publish:
    name: Attest and publish immutable release
    needs: package
    # Publishing requires a separate, explicit opt-in after public-repository sign-off.
    if: github.event.repository.private == false && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release
      - name: Check release identity, completeness, and hashes
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_TAG: ${{ needs.package.outputs.tag }}
        run: node scripts/verify-release.ts
      - name: Attest every release file
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Bind the runtime SBOM to the deployable archive
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/website.tar.gz
          sbom-path: release/sbom-runtime.cdx.json
      - name: Include offline verification bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" release/sbom.sigstore.json
      - name: Upload a complete draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # No clobber or delete: reruns cannot silently replace a release.
          gh release create "$RELEASE_TAG" release/* --repo joshcazalas/website \
            --target "$COMMIT_SHA" --draft --title "$RELEASE_TAG" \
            --notes "Verified website build from commit $COMMIT_SHA."
          gh release edit "$RELEASE_TAG" --repo joshcazalas/website --draft=false
          gh api "repos/joshcazalas/website/releases/tags/$RELEASE_TAG" --jq '.immutable' | grep -qx true
          gh release verify "$RELEASE_TAG" --repo joshcazalas/website
