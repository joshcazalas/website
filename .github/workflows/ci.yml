name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      private-media:
        description: Test without retaining builds or game assets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    with:
      package-release: true
      private-media: ${{ inputs.private-media == true }}
    secrets:
      ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}

  validate:
    name: Validate
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete validation workflow
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
